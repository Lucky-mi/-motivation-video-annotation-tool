    ---

    ## Final Reminders

    1. Use DDF v1.0 labels ONLY — do not invent new formats
    2. All timestamps in float seconds (e.g. 12.5)
    3. JSON must be valid and parseable — no trailing commas
    4. Omit empty optional fields — do not output null
    5. Every desire needs evidence — at least one observable behavior
    6. Parsimony — prefer simpler (lower dimension) explanations
    7. Log neutral segments in metadata, don't fabricate desires
    8. Track "other" usage count in metadata
    9. Key segments for QA — identify 3-5 valuable moments
    10. Retain behavioral_sequence for fine-grained "What" timeline
    11. Retain inter_character_dynamics for multi-person analysis

