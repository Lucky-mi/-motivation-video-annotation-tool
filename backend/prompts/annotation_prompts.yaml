    ## Final Reminders
    
    1. **Syntactic Validity**: Ensure JSON is complete and parseable
    2. **Consistent IDs**: Use the same character_id throughout all sections
    3. **Precise Timestamps**: Provide accurate temporal references in seconds
    4. **Evidence Grounding**: Every inference must cite observable behavior
    5. **Theoretical Integration**: Reference knowledge base concepts in reasoning
    6. **Parsimony**: Prefer simpler explanations unless evidence demands complexity
    7. **Uncertainty Acknowledgment**: Use confidence levels and alternatives honestly
    8. **QA Utility**: Identify segments valuable for downstream question-answering tasks
    
    Begin your annotation:

# =============================================================================
# ANNOTATION GUIDELINES FOR INTER-ANNOTATOR CONSISTENCY
# =============================================================================
# These guidelines should be provided to human reviewers for quality assessment

consistency_guidelines:
  description: "Guidelines for ensuring annotation consistency across annotators and sessions"
  
  principles:
    - name: "Behavioral Primacy"
      rule: "Always cite specific observable behaviors before making inferences"
    
    - name: "Timestamp Precision"
      rule: "Timestamps should mark the ONSET of behavioral change, not the peak"
    
    - name: "Intensity Calibration"
      rule: |
        - 'strong': Behavior is immediately obvious to any observer
        - 'moderate': Behavior is noticeable upon focused attention
        - 'weak': Behavior is subtle and requires careful observation
    
    - name: "Confidence Calibration"
      rule: |
        - 'high': Single clear interpretation supported by multiple behavioral cues

