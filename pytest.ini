# pytest.ini
# Pytest配置文件

[pytest]
# 测试文件搜索模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = backend/tests

# 输出选项
addopts =
    -v                      # 详细输出
    --tb=short              # 简短的traceback
    --strict-markers        # 严格的marker检查
    --disable-warnings      # 禁用警告（可选）
    -ra                     # 显示所有测试结果摘要
    --color=yes             # 彩色输出
    --durations=10          # 显示最慢的10个测试

# Markers定义
markers =
    slow: 慢速测试（需要较长时间）
    integration: 集成测试
    unit: 单元测试
    api: API测试
    requires_api_key: 需要实际API key的测试

# 忽略的路径
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    venv
    __pycache__

# 覆盖率配置（如果使用pytest-cov）
# 需要安装: pip install pytest-cov
# 然后运行: pytest --cov=backend --cov-report=html
